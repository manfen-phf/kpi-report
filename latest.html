<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>商品运营分析报告</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
  <div class="header">
    <h1>📊 商品运营分析报告</h1>
    <div class="subtitle" id="subtitle"></div>
  </div>

  <div class="main-tabs">
    <button class="main-tab-btn active" id="mb1">📊 分区进度</button>
    <button class="main-tab-btn" id="mb2">📢 玉林总商KPI播报</button>
  </div>

  <!-- ==================== TAB 1：分区进度 ==================== -->
  <div id="tab1" class="tab-content active">
    <div class="time-progress">
      <h3><span>⏰</span><span id="tpTitle"></span></h3>
      <div class="progress-bar-container">
        <div class="progress-label"><span>时间进度</span><span id="tpLabel"></span></div>
        <div class="progress-bar"><div class="progress-fill" id="tpFill"></div></div>
      </div>
    </div>

    <div style="padding:16px 20px 4px;">
      <div style="font-size:16px;font-weight:700;color:#333;margin-bottom:16px;display:flex;align-items:center;gap:8px;">
        <span>📊</span>
        <span>KPI指标（<b id="focusDist">—</b> vs 广西区域）</span>
        <span style="font-size:12px;font-weight:400;color:#999;margin-left:auto;" id="kpiDate"></span>
      </div>
      <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:20px;" id="distCards"></div>
    </div>

    <div style="padding:14px 20px 0;">
      <div style="font-size:15px;font-weight:700;color:#1f3a63;margin-bottom:4px;">🏅 分区经理排名</div>
      <div style="font-size:11.5px;color:#888;margin-bottom:12px;">
        综合得分 = 拼好饭完成率×40% + 神抢手攻克率×30% + 拼好饭攻克率×20% + 月度覆盖率×10%（满分 100）
        ｜ 风险状态以广西区域基准为标尺：<span style="color:#52c41a;font-weight:700;">≥ 基准 → 正常</span> /
        <span style="color:#fa8c16;font-weight:700;">低于基准 → 低风险</span> /
        <span style="color:#f5222d;font-weight:700;">低于基准 2 分以上 → 高风险</span>
      </div>
      <div class="ops-tools" style="padding:0 0 12px;">
        <select class="sel" id="focusSel"></select>
        <span style="font-size:11.5px;color:#888;">切换分区可同步刷新上方四张卡片</span>
      </div>
    </div>
    <div class="rank-wrap"><table class="rank-grid" id="rankTable"></table></div>
  </div>

  <!-- ==================== TAB 2：玉林总商 KPI 播报 ==================== -->
  <div id="tab2" class="tab-content">
    <div class="frame">
      <div class="card" id="kpiCard">
        <div class="title" id="kpiTitle"></div>
        <div class="subtitle" id="kpiSub"></div>
        <div class="progress-row">
          <span class="label" id="prLabel"></span>
          <span class="bar"><span class="fill" id="prFill"></span></span>
          <span class="pct" id="prPct"></span>
        </div>
        <div class="warnbox hidden" id="kpiWarn"></div>

        <div id="kpiTables"></div>

        <div class="section-h">
          <span class="left">🔍 城市货盘与商家下钻</span>
          <span class="sub">按城市查看货盘来源结构、做功场景与商家明细</span>
        </div>
        <div class="ops-tools">
          <select class="sel" id="citySel"></select>
          <button class="btn on" id="bizSqs">神抢手</button>
          <button class="btn" id="bizPhf">拼好饭</button>
          <select class="sel" id="sortSel">
            <option value="ord">按订单量降序</option>
            <option value="amt">按实付金额降序</option>
            <option value="rate">按达标率升序</option>
            <option value="pool">按货盘数降序</option>
          </select>
          <input class="inp" id="shopSearch" placeholder="搜索商家名称 / BD MIS ID" style="width:230px">
          <span style="font-size:11.5px;color:#888;" id="shopCount"></span>
        </div>
        <div class="charts">
          <div class="chart-box">
            <h4>货盘来源达标率</h4>
            <div class="cap" id="srcCap"></div>
            <div id="srcChart"></div>
          </div>
          <div class="chart-box">
            <h4>结算价下探 · 做功场景分布</h4>
            <div class="cap" id="sceneCap"></div>
            <div id="sceneChart"></div>
          </div>
        </div>
        <div class="shop-tbl-wrap"><table class="shop" id="shopTable"></table></div>

        <div class="notes" id="notesBox"></div>
        <div class="footer" id="footerBox"></div>
      </div>
    </div>
  </div>
</div>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
